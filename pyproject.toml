[project]
name = "coral-template-seg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "iquana-service-core",
    "iquana-toolbox",
    "celery>=5.3.0",
    "redis>=4.5.0",
    "flower>=2.0.0",
    "mlflow>=2.10.0",
    "celery-types>=0.26.0",
    "torch>=2.11.0",
    "transformers>=4.56.0",  # DINOv3 model support landed in 4.56
    "timm>=0.9.0",
    "accelerate>=0.26.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",  # Hungarian matching (linear_sum_assignment) in the DINOv3 set loss
]

[tool.uv.sources]
iquana-service-core = { git = "https://github.com/Iquana-tool/iquana-service-core.git" }
# For local dev before that repo is pushed, swap the line above for a path source:
# iquana-service-core = { path = "../iquana-service-core" }
iquana-toolbox = { git = "https://github.com/Iquana-tool/iquana-toolbox.git" }
